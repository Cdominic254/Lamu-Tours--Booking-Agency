<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Lamu Experience - Lamu Tours</title>
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; }
        header { padding: 2rem 1rem; text-align: center; color: white; background: linear-gradient(135deg, #1e3c72, #2a5298); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); text-shadow: 2px 2px 4px rgba(0,0,0,.3); }
        nav { display: flex; justify-content: center; flex-wrap: wrap; gap: .4rem; padding: .8rem; background: linear-gradient(90deg, #2a5298, #1e3c72); }
        nav a { padding: .7rem 1rem; border-radius: 6px; color: white; text-decoration: none; font-weight: 500; }
        nav a:hover { background: #ff9a56; color: #1e3c72; }
        main { max-width: 560px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); animation: fadeInUp .7s ease; }
        h2 { margin-top: 0; color: #1e3c72; border-bottom: 3px solid #ff9a56; padding-bottom: .5rem; }
        p { color: #555; line-height: 1.6; }
        form { display: flex; flex-direction: column; }
        label { margin-top: 1rem; color: #1e3c72; font-weight: 600; }
        input { width: 100%; padding: .8rem; margin-top: .5rem; border: 2px solid #e0e0e0; border-radius: 6px; font: inherit; }
        input:focus { outline: none; border-color: #ff9a56; box-shadow: 0 0 8px rgba(255,154,86,.3); }
        button { margin-top: 1.5rem; padding: .8rem 1.5rem; border: 0; border-radius: 6px; background: linear-gradient(135deg, #ff9a56, #ff7e3f); color: white; cursor: pointer; font: 600 1em inherit; box-shadow: 0 4px 12px rgba(255,154,86,.3); }
        button:hover { transform: translateY(-2px); }
        .message { display: none; padding: .8rem 1rem; border-left: 4px solid #d9534f; border-radius: 6px; background: #fff1f0; color: #a12622; }
        .message.visible { display: block; }
        a { color: #2a5298; }
        nav { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .25rem; }
        nav a { color: white; padding: .7rem .8rem; border-radius: 6px; text-decoration: none; }
        .account-link { margin-left: auto !important; background: #ff9a56; color: #1e3c72 !important; font-weight: 700 !important; }
        .account-link:hover { background: #1e3c72; color: white !important; }
    </style>
    <link rel="stylesheet" href="styles.css">
    <script src="animations.js" defer></script>
</head>
<body>
    <header><h1>Join the Lamu Experience</h1></header>
    <nav>
        <a href="index.html">Home</a><a href="tours.html">Tours</a><a href="booking.html">Booking</a><a href="about-lamu.html">About Lamu</a><a href="contact.html">Contact</a><a href="hospitality.html">Hospitality</a><a class="account-link" href="login.html">Sign in / Register</a>
    </nav>
    <main>
        <h2>Create your account</h2>
        <p>Register to make and manage your Lamu tour bookings.</p>
        <p id="form-message" class="message" role="alert"></p>
        <form action="/register" method="post">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
            <button type="submit">Create account</button>
        </form>
        <p>Already have an account? <a href="login.html">Log in</a>.</p>
    </main>
    <script>
        const error = new URLSearchParams(window.location.search).get('error');
        if (error) { const message = document.getElementById('form-message'); message.textContent = error; message.classList.add('visible'); }
    </script>
</body>
</html>
